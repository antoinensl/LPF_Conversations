name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# a newer push replaces a build still running for the same branch
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          set -e
          ART=build/LPFConversations_artefacts/Release
          OUT=LPF-Conversations-${{ matrix.name }}
          mkdir -p "$OUT"
          cp -R "$ART/VST3/Conversations.vst3" "$OUT/"
          if [ -d "$ART/AU" ]; then cp -R "$ART/AU/Conversations.component" "$OUT/"; fi
          if [ -d "$ART/Standalone/Conversations.app" ]; then cp -R "$ART/Standalone/Conversations.app" "$OUT/";
          elif [ -f "$ART/Standalone/Conversations.exe" ]; then cp "$ART/Standalone/Conversations.exe" "$OUT/";
          else cp "$ART/Standalone/Conversations" "$OUT/"; fi
          CLI=$(find build -maxdepth 3 -type f \( -name conversations_cli -o -name conversations_cli.exe \) | head -1)
          cp "$CLI" "$OUT/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "$OUT/"
          cp -R licenses "$OUT/"
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "$OUT.zip" "$OUT" > /dev/null; else zip -qry "$OUT.zip" "$OUT"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LPF-Conversations-${{ matrix.name }}
          path: LPF-Conversations-${{ matrix.name }}.zip

  # One release per version: the tag v<version> (from CMakeLists.txt) is created here,
  # so a push to main is enough to publish.
  release:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Version
        id: ver
        run: |
          V=$(sed -n 's/^project(LPFConversations VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version $V"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum *.zip | tee SHA256SUMS.txt

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.zip

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Conversations v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            VST3, AU (macOS) and Standalone plugin, plus the command-line tool.
            Unsigned binaries: see "Install" in the README (macOS quarantine, Windows unblock).
            Verify a download: gh attestation verify <file>.zip -R lifepassfilter/LPF_Conversations (checksums in SHA256SUMS.txt).
            The README also covers routing in Reaper, Ableton Live and the standalone app.
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
